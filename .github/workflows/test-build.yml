# Fork-only: test the fix and build a linux x86_64 bichon-server for manual testing.
name: Test build
on:
  push:
    branches: [ci/test-build]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install -g pnpm@10.18.3

      - name: Install frontend deps
        working-directory: ./web
        run: pnpm install --frozen-lockfile

      - name: Regression test for this fix
        working-directory: ./web
        run: pnpm exec vitest run src/features/accounts/components/__tests__/date-since-null.test.ts

      - name: Existing account tests (informational)
        continue-on-error: true
        working-directory: ./web
        run: pnpm exec vitest run src/features/accounts

      - name: Same tests on upstream main (baseline)
        continue-on-error: true
        run: |
          git fetch --depth=1 https://github.com/rustmailer/bichon main
          git worktree add /tmp/base FETCH_HEAD
          cd /tmp/base/web
          pnpm install --frozen-lockfile
          pnpm exec vitest run src/features/accounts

      - name: Build frontend
        working-directory: ./web
        run: pnpm run build

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build bichon-server
        run: |
          cargo build --release --bin bichon-server
          strip target/release/bichon-server
          sha256sum target/release/bichon-server

      - uses: actions/upload-artifact@v4
        with:
          name: bichon-server-x86_64-unknown-linux-gnu
          path: target/release/bichon-server
